name: Deploy Edge Functions

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy agenda-push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy agenda-push --project-ref cppuceykhffjdcmwpfpk --no-verify-jwt || true
      # DESLIGADO EM 06/09/2026 — a versao em producao do ler-fatura esta A FRENTE
      # deste repositorio: este workflow falha desde 27/07/2026 e as correcoes foram
      # publicadas direto no Supabase (producao esta na versao 10).
      # Rodar este passo AGORA sobrescreveria producao com codigo antigo.
      # Antes de religar: baixar o fonte de producao, sincronizar
      # supabase/functions/ler-fatura/index.ts e so entao remover o "if: false".
      - name: Deploy ler-fatura
        if: false
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy ler-fatura --project-ref cppuceykhffjdcmwpfpk
      - name: Deploy excluir-conta
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy excluir-conta --project-ref cppuceykhffjdcmwpfpk
