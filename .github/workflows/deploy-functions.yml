name: Deploy Edge Functions

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy agenda-push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy agenda-push --project-ref cppuceykhffjdcmwpfpk --no-verify-jwt || true
      # 06/09/2026: o repositorio foi sincronizado com o fonte que roda em producao
      # (versao 10, publicada direto no Supabase). Religado.
      # ATENCAO: este workflow falha desde 27/07/2026 no passo abaixo, provavelmente
      # por SUPABASE_ACCESS_TOKEN vencido. Enquanto nao arrumar o token, publique
      # pelo painel do Supabase e sincronize este arquivo depois.
      - name: Deploy ler-fatura
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy ler-fatura --project-ref cppuceykhffjdcmwpfpk
      - name: Deploy excluir-conta
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy excluir-conta --project-ref cppuceykhffjdcmwpfpk
